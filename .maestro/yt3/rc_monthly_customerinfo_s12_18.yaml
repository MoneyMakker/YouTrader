appId: com.youtrader.pro
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Your trading system is ready|qa.reset.complete"
    timeout: 90000
- extendedWaitUntil:
    visible: "Your trading system is ready"
    timeout: 60000
- takeScreenshot: docs/releases/1.6.1/phase4f-screenshots/s12_rc18_paywall
- scroll
- scroll
- runFlow:
    when:
      visible: "MONTHLY"
    commands:
      - tapOn: "MONTHLY"
- runFlow:
    when:
      visible: ".*7-Day.*|Start .*Pro|Continue"
    commands:
      - tapOn: ".*7-Day.*|Start .*Pro|Continue"
- waitForAnimationToEnd
- takeScreenshot: docs/releases/1.6.1/phase4f-screenshots/s12_rc18_after_cta
- runFlow:
    when:
      visible: "Sign in to Apple Account"
    commands:
      - takeScreenshot: docs/releases/1.6.1/phase4f-screenshots/s12_rc18_BLOCKED_apple_account
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Confirm|Subscribe|Buy|Environment: Xcode|OK"
    commands:
      - tapOn: "Confirm|Subscribe|Buy|OK"
- waitForAnimationToEnd
- takeScreenshot: docs/releases/1.6.1/phase4f-screenshots/s12_rc18_monthly_result
