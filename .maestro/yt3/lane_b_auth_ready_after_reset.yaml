appId: com.youtrader.pro
---
# Auth readiness: give wipe time, terminate, cold relaunch (proven s9c contract)
- launchApp:
    clearState: false
- openLink: youtrader://qa/reset-auth
- waitForAnimationToEnd
# Allow async wipe to finish before kill (in-process Auth is best-effort).
- repeat:
    times: 10
    commands:
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "auth.screen"
    commands:
      - assertVisible:
          id: "auth.screen"
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "auth.screen"
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: "auth.google"
    timeout: 30000
- assertVisible:
    id: "auth.email"
- runFlow:
    when:
      visible:
        id: "auth.ready"
    commands:
      - assertVisible:
          id: "auth.ready"
- takeScreenshot: docs/releases/1.6.1/phase4f-screenshots/s9_auth_ready
- runFlow:
    when:
      visible:
        id: "auth.apple"
    commands:
      - assertVisible:
          id: "auth.apple"
