appId: com.youtrader.pro
---
- launchApp:
    clearState: false
- openLink: youtrader://qa/email-login?role=allow
- repeat:
    times: 10
    commands:
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - runFlow:
          when:
            visible: "Your trading system is ready"
          commands:
            - tapOn:
                id: "acquisition-paywall-close"
- extendedWaitUntil:
    visible: "Journal"
    timeout: 90000
- openLink: youtrader://qa/seed-trade
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "MES, LONG.*"
    direction: DOWN
    timeout: 20000
- swipe:
    from: "MES, LONG.*"
    direction: LEFT
- extendedWaitUntil:
    visible: "Delete Trade"
    timeout: 10000
- tapOn: "Delete Trade"
- runFlow:
    when:
      visible: "Delete Trade"
    commands:
      - tapOn: "Delete Trade"
- takeScreenshot: docs/releases/1.6.1/phase4f-screenshots/jcrud6b4_deleted
