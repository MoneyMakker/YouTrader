appId: com.youtrader.pro
---
# Seed → tap edit → update via save id → delete
- launchApp:
    clearState: false
- openLink: youtrader://qa/email-login?role=allow
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - runFlow:
          when:
            visible: "Your trading system is ready"
          commands:
            - tapOn:
                id: "acquisition-paywall-close"
      - runFlow:
          when:
            visible: "OK"
          commands:
            - tapOn: "OK"
- extendedWaitUntil:
    visible: "Journal"
    timeout: 90000
- openLink: youtrader://qa/seed-trade
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "MES, LONG.*"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 20
- takeScreenshot: docs/releases/1.6.1/phase4f-screenshots/jcrud6b4_seeded
- tapOn: "MES, LONG.*"
- extendedWaitUntil:
    visible: "Update Trade|Entry Price"
    timeout: 15000
# Prove update path without relying on Maestro TextInput onChange
- scrollUntilVisible:
    element:
      id: "journal-save-trade"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 40
- tapOn:
    id: "journal-save-trade"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Trade saved.*|View performance|Maybe later"
    commands:
      - takeScreenshot: docs/releases/1.6.1/phase4f-screenshots/jcrud6b4_edited_prompt
      - runFlow:
          when:
            visible: "Maybe later"
          commands:
            - tapOn: "Maybe later"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- takeScreenshot: docs/releases/1.6.1/phase4f-screenshots/jcrud6b4_edited
- tapOn: "Journal"
- scrollUntilVisible:
    element: "MES, LONG.*"
    direction: DOWN
    timeout: 15000
- swipe:
    from: "MES, LONG.*"
    direction: LEFT
- extendedWaitUntil:
    visible: "Delete Trade"
    timeout: 10000
- tapOn: "Delete Trade"
- runFlow:
    when:
      visible: "Delete Trade"
    commands:
      - tapOn: "Delete Trade"
- takeScreenshot: docs/releases/1.6.1/phase4f-screenshots/jcrud6b4_deleted

