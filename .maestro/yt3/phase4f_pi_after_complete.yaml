appId: com.youtrader.pro
name: YT3 Phase 4F — PI poll after complete
---
- launchApp
- extendedWaitUntil:
    visible: "Continue with Apple|Journal|Log. Review. Improve.|Your Trading Journal"
    timeout: 60000
- openLink: "youtrader://qa/email-login?role=allow"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible: "Journal"
    timeout: 60000
- openLink: "youtrader://qa/tab?id=propPass"
- extendedWaitUntil:
    visible: "Prop Pass"
    timeout: 30000
- assertVisible: "Buffer Health"
- tapOn: "Performance Intelligence"
- extendedWaitUntil:
    visible: "Performance Intelligence"
    timeout: 20000
- takeScreenshot: phase4f_pi_06_completed_panel
- assertVisible: "Insufficient sample|Snapshot current|Snapshot outdated|Incomplete data|No snapshot for this scope|Calculation queued or running"
- runFlow:
    when:
      visible: "Request calculation"
    commands:
      - tapOn: "Request calculation"
- extendedWaitUntil:
    visible: "Insufficient sample|Snapshot current|Snapshot outdated|Incomplete data|Calculation failed"
    timeout: 90000
- takeScreenshot: phase4f_pi_07_after_rerequest_poll
- scroll
- takeScreenshot: phase4f_pi_08_completed_scrolled
- assertNotVisible: "AI Analytics"
