# Returning allowlisted user → Prop Pass home
appId: com.youtrader.pro
name: YT3 Phase 4F — returning allowlisted Prop Pass
---
- launchApp
# Wait for startup hydrate to finish (auth or main) before email login.
- extendedWaitUntil:
    visible: "Continue with Apple|Journal|Log. Review. Improve."
    timeout: 60000
- openLink: "youtrader://qa/email-login?role=allow"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: "92%,86%"
- extendedWaitUntil:
    visible: "Journal"
    timeout: 60000
- takeScreenshot: phase4f_returning_journal
- openLink: "youtrader://qa/tab?id=propPass"
- extendedWaitUntil:
    visible: "Prop Pass"
    timeout: 30000
- takeScreenshot: phase4f_returning_prop_pass
- assertNotVisible: "No Prop account"
- assertVisible: "Buffer Health"
- scroll
- takeScreenshot: phase4f_returning_prop_pass_scrolled
- assertNotVisible: "AI Analytics"
