name: YTStoreKitQA
options:
  bundleIdPrefix: com.youtrader.qa
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1"
targets:
  YTStoreKitQA:
    type: application
    platform: iOS
    sources: [App]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.youtrader.qa.storekit.host
    scheme:
      storeKitConfiguration: ../YouTraderStaging.storekit
      testTargets: [YTStoreKitQATests]
  YTStoreKitQATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["*.storekit"]
    resources:
      - path: Resources/YouTraderStaging.storekit
    dependencies:
      - target: YTStoreKitQA
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.youtrader.qa.storekit.tests
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YTStoreKitQA.app/YTStoreKitQA"
      BUNDLE_LOADER: "$(TEST_HOST)"
